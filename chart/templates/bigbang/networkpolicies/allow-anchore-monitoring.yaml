{{- if and .Values.networkPolicies.enabled .Values.monitoring.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-ingress-anchore
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: anchore-enterprise
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          app.kubernetes.io/name: monitoring
      podSelector:
        matchLabels:
          app: prometheus
    ports:
    - protocol: TCP
      port: 8228   # external-api
    - protocol: TCP
      port: 8082   # catalog
    - protocol: TCP
      port: 8087   # policy
    - protocol: TCP
      port: 8083   # simplequeue
    - protocol: TCP
      port: 8084   # analyzer
    - protocol: TCP
      port: 8088   # feeds
    - protocol: TCP
      port: 8558   # reports
    - protocol: TCP
      port: 8668   # notifications
{{- end }}
